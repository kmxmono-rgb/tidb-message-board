<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>TiDB Cloud 安全雲端留言板</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    textarea { margin-bottom: 10px; }
    button { padding: 8px 16px; cursor: pointer; }
    .msg-card { border: 1px solid #ddd; padding: 12px; margin-top: 12px; border-radius: 6px; }
    .msg-header { display: flex; justify-content: space-between; color: #555; font-size: 0.9em; }
    .msg-content { white-space: pre-wrap; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>安全雲端資料庫留言板</h1>
  
  <div class="row">
    <input type="text" id="author" placeholder="你的名字" />
    <input type="password" id="password" placeholder="設定編輯/刪除密碼" />
  </div>
  <textarea id="content" rows="3" placeholder="寫下留言內容（已支援防 XSS 攻擊過濾）..."></textarea>
  <button onclick="addMessage()">送出留言</button>

  <hr>
  <div id="list">載入中...</div>

  <script>
    // 防 XSS 攻擊函式：將特殊字元轉為純文字實體，防止惡意執行 JavaScript
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadMessages() {
      const res = await fetch('/api/messages');
      const result = await res.json();
      const listDiv = document.getElementById('list');

      if (!result.success || result.data.length === 0) {
        listDiv.innerHTML = '<p>目前還沒有任何留言，快來搶頭香！</p>';
        return;
      }

      listDiv.innerHTML = result.data.map(item => `
        <div class="msg-card">
          <div class="msg-header">
            <strong>${escapeHTML(item.author)}</strong>
            <span>${new Date(item.created_at).toLocaleString()} 
              <button data-id="${item.id}" data-content="${escapeHTML(item.content)}" onclick="editMessage(this)" style="margin-left:8px; color:blue;">編輯</button>
              <button onclick="deleteMessage(${item.id})" style="margin-left:4px; color:red;">刪除</button>
            </span>
          </div>
          <div class="msg-content">${escapeHTML(item.content)}</div>
        </div>
      `).join('');
    }

    async function addMessage() {
      const author = document.getElementById('author').value.trim();
      const password = document.getElementById('password').value.trim();
      const content = document.getElementById('content').value.trim();
      if (!author || !password || !content) return alert('請填寫名字、密碼與內容！');

      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author, content, password })
      });
      const result = await res.json();
      if (result.success) {
        document.getElementById('content').value = '';
        loadMessages();
      } else {
        alert(result.message);
      }
    }

    async function editMessage(btn) {
      const id = btn.getAttribute('data-id');
      const oldContent = btn.getAttribute('data-content');

      const newContent = prompt('請輸入新的留言內容：', oldContent);
      if (newContent === null || newContent.trim() === '' || newContent === oldContent) return;

      const password = prompt('請輸入這則留言的設定密碼：');
      if (!password) return;

      const res = await fetch(`/api/messages/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: newContent.trim(), password })
      });
      const result = await res.json();
      alert(result.message);
      if (result.success) loadMessages();
    }

    async function deleteMessage(id) {
      const password = prompt('請輸入這則留言的密碼以確認刪除：');
      if (!password) return;

      const res = await fetch(`/api/messages/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const result = await res.json();
      alert(result.message);
      if (result.success) loadMessages();
    }

    loadMessages();
  </script>
</body>
</html>
