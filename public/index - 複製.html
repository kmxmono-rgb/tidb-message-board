<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Node.js 全端測試網站</title>
</head>
<body>
  <h1>網站運作成功！</h1>
  <button onclick="checkStatus()">測試連接資料庫</button>
  <pre id="result">點擊按鈕查看結果...</pre>

  <script>
    async function checkStatus() {
      const response = await fetch('/api/status');
      const data = await response.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
